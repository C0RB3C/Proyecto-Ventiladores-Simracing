[network]
# IP del ESP32 en tu red local (la vereis por el puerto serie al arrancarlo)
esp32_ip = 192.168.1.50
esp32_port = 4210
# Veces por segundo que se envia el duty cycle por UDP
send_rate_hz = 15

[curve]
# Por debajo de esta velocidad el ventilador va al duty minimo
min_speed_kmh = 10
# Por encima de esta velocidad el ventilador va al 100%
max_speed_kmh = 260
# Duty (%) cuando el coche esta parado o muy lento (0 = apagado)
min_duty_percent = 0
# Duty (%) maximo, por si no quieres que llegue nunca al 100%
max_duty_percent = 100
# Exponente de la curva entre min y max speed: 1 = lineal,
# >1 = arranca mas suave y sube fuerte al final, <1 = al reves
curve_exponent = 1.0

[behavior]
# Si el coche no esta en pista (menus, pits con sesion parada, etc.) forzar duty a 0
fan_off_when_not_on_track = true
